<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Warewolf Virtual Office</title>
    <link rel="stylesheet" href="css/office.css" />
    <link rel="stylesheet" href="css/desktopOs.css" />
  </head>
  <body>
    <main class="stage" id="office-stage">
      <h1 class="office-title">Warewolf · Starter Loft</h1>
      <p class="bucks-hud" id="bucks-hud" aria-live="polite">
        0 bucks
      </p>
      <canvas
        id="office-canvas"
        aria-label="Isometric starter office"
      ></canvas>
      <p
        class="interact-prompt"
        id="interact-prompt"
        hidden
      ></p>
      <p class="office-toast" id="office-toast" hidden></p>

      <section
        id="desktop-os"
        class="desktop-os"
        hidden
        aria-label="Desk desktop"
      >
        <div class="desktop-wallpaper">
          <button
            type="button"
            class="desktop-icon"
            data-app="teams"
          >
            <span class="desktop-icon-glyph teams-glyph"
              >T</span
            >
            <span class="desktop-icon-label">Teams</span>
          </button>
          <button
            type="button"
            class="desktop-icon"
            data-app="directory"
          >
            <span
              class="desktop-icon-glyph directory-glyph"
              >D</span
            >
            <span class="desktop-icon-label"
              >Directory</span
            >
          </button>
          <button
            type="button"
            class="desktop-icon"
            data-app="goals"
          >
            <span class="desktop-icon-glyph goals-glyph"
              >G</span
            >
            <span class="desktop-icon-label">Goals</span>
          </button>
          <button
            type="button"
            class="desktop-icon"
            data-app="loft"
          >
            <span class="desktop-icon-glyph loft-glyph"
              >L</span
            >
            <span class="desktop-icon-label">Loft</span>
          </button>
        </div>

        <div class="desktop-window" hidden>
          <header class="window-chrome">
            <span class="window-title"></span>
            <button
              type="button"
              class="window-close"
              aria-label="Close window"
            >
              ×
            </button>
          </header>
          <div class="window-body"></div>
        </div>

        <footer class="desktop-taskbar">
          <button type="button" id="desktop-exit">
            Leave desk
          </button>
          <span class="taskbar-clock"></span>
        </footer>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
